<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Prevent errors if subsequent scripts try to overwrite or wrap window.fetch
      (function() {
        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          
          try {
            delete window.fetch;
          } catch(e) {}
          
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Redefining fetch directly failed, trying prototype redefine:", e);
          try {
            const originalFetch = window.fetch;
            let currentFetch = originalFetch;
            Object.defineProperty(Object.getPrototypeOf(window), 'fetch', {
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {
            console.error("Redefining fetch on prototype failed:", e2);
          }
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blink App</title>

  </head>

</html>
