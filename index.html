<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Prevent errors if subsequent scripts try to overwrite or wrap window.fetch
      (function() {
        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          
          try {
            delete window.fetch;
          } catch(e) {}
          
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Redefining fetch directly failed, trying prototype redefine:", e);
          try {
            const originalFetch = window.fetch;
            let currentFetch = originalFetch;
            Object.defineProperty(Object.getPrototypeOf(window), 'fetch', {
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {
            console.error("Redefining fetch on prototype failed:", e2);
          }
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="AI Assistant Web Application" />
    <title>My AI</title>
    <script>
      (function() {
        try {
          const manifest = {
            name: "My AI",
            short_name: "My AI",
            description: "AI Assistant Web Application",
            start_url: "./",
            scope: "./",
            display: "standalone",
            orientation: "portrait-primary",
            theme_color: "#000000",
            background_color: "#000000",
            icons: []
          };

          const manifestBlob = new Blob(
            [JSON.stringify(manifest)],
            { type: "application/manifest+json" }
          );

          const manifestURL = URL.createObjectURL(manifestBlob);

          const link = document.createElement("link");
          link.rel = "manifest";
          link.href = manifestURL;
          document.head.appendChild(link);
        } catch (e) {
          console.warn("Manifest creation failed:", e);
        }
      })();
    </script>
